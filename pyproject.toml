[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-chat"
version = "0.1.0"
description = "Chat with your entire knowledge base: hybrid retrieval, reranking, verified citations, and retrieval evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ansh Jain" }]
keywords = ["rag", "retrieval", "hybrid-search", "reranking", "evaluation", "citations"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "numpy>=1.24",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.34"]
embeddings = ["voyageai>=0.2", "openai>=1.30"]
rerank = ["cohere>=5.0"]
local = ["sentence-transformers>=3.0", "torch>=2.2"]
youtube = ["youtube-transcript-api>=0.6"]
viz = ["scikit-learn>=1.4", "umap-learn>=0.5"]
# The corpus map works with neither installed: it falls back to a numpy PCA.
dev = [
  "pytest>=8.1",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML",
]
all = ["kb-chat[llm,embeddings,rerank,youtube,viz]"]

[project.scripts]
kb = "kb.cli:main"

[project.urls]
Homepage = "https://github.com/anshnt/Chat-With-Your-Entire-Knowledge-Base"
Repository = "https://github.com/anshnt/Chat-With-Your-Entire-Knowledge-Base"

[tool.hatch.build.targets.wheel]
packages = ["backend/kb"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
# RUF001-003: the "›" heading separator and math symbols in docstrings are deliberate.
ignore = ["E501", "B008", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." is required so `tests.*` helper modules import under a bare `pytest`
# invocation. `python -m pytest` prepends the cwd for you; plain `pytest` does
# not, and CI uses the latter.
pythonpath = ["backend", "."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
  "slow: marks tests as slow",
  "network: marks tests that require network access",
]

[tool.mypy]
python_version = "3.10"
mypy_path = "backend"
packages = ["kb"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.coverage.run]
source = ["backend/kb"]
omit = ["*/tests/*"]
